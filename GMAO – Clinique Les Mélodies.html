<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GMAO – Clinique Les Mélodies</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#312587;--red:#e5313d;--bg:#f6f7fb;--card:#fff;--tx:#1b1a3a;--mu:#6c6c8c;--bd:#e6e7f1;--ok:#17996a;--wa:#e8951a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Poppins,system-ui,sans-serif;display:flex;min-height:100vh}
aside{width:250px;background:#fff;border-right:1px solid var(--bd);padding:16px 12px;display:flex;flex-direction:column;gap:3px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
.lg{padding:0 6px 12px;border-bottom:1px solid var(--bd);margin-bottom:10px}.lg img{width:100%;display:block}
.nv{all:unset;cursor:pointer;padding:10px 12px;border-radius:10px;display:flex;align-items:center;gap:10px;color:var(--tx);font-weight:500}
.nv:hover{background:#f0effa}.nv.on{background:var(--navy);color:#fff}
.nv svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.bg{margin-left:auto;background:var(--red);color:#fff;border-radius:20px;font-size:11px;padding:0 8px;font-weight:600}
.ft{margin-top:auto;font-size:11px;color:var(--mu);padding:10px 6px 0}
main{flex:1;min-width:0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 26px;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.bar h1{margin:0;font-size:20px;color:var(--navy);font-weight:600}.bar small{color:var(--mu)}
.pg{padding:22px 26px}
.g{display:grid;gap:14px}.k{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}.two{grid-template-columns:3fr 2fr;margin-top:14px}.eq2{grid-template-columns:1fr 1fr;margin-top:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:0 1px 3px #31258a0d}
.kp{border-top:3px solid var(--navy)}.kp.r{border-top-color:var(--red)}
.kp b{font-size:28px;line-height:1.1;display:block;font-weight:600}.kp span{color:var(--mu);font-size:12px}
h3{margin:0 0 10px;font-size:15px;font-weight:600}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mu);font-size:12px;font-weight:600;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}tr:last-child td{border:0}.w{overflow-x:auto}
.p{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;color:#fff}
.ok{background:var(--ok)}.ko{background:var(--red)}.wa{background:var(--wa)}.nb{background:var(--navy)}.gr{background:#9a99b6}
.bt{all:unset;cursor:pointer;background:var(--navy);color:#fff;padding:8px 16px;border-radius:10px;font-weight:600;font-size:13px}.bt.r{background:var(--red)}.bt.o{background:#fff;color:var(--navy);border:1px solid var(--navy)}.bt.s{padding:3px 10px;font-size:12px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--tx);font:inherit;margin-top:3px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:8px;font-weight:500}
.tl{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}.tl>*{flex:1;min-width:150px}.tl input,.tl select{margin:0}
dialog{border:none;border-radius:16px;padding:20px;width:min(480px,94vw);max-height:90vh}dialog::backdrop{background:#1b1a3a80}
.al{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);border-left:4px solid var(--wa);margin-bottom:8px;background:#fff}
.al.crit{border-left-color:var(--red);background:#fff6f7}.al div{flex:1}.al small{color:var(--mu);display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:12px}.cal div{padding:7px 0;border-radius:8px;position:relative}.cal .h{color:var(--mu);font-weight:600}.cal .t{background:var(--navy);color:#fff}.cal .d::after{content:"";position:absolute;bottom:2px;left:50%;margin-left:-3px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.pb{height:8px;background:#ecebf6;border-radius:6px;overflow:hidden;min-width:70px}.pb i{display:block;height:100%}
.lg2{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-bottom:6px}.lg2 i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}.ph img{width:92px;height:92px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}.ph.big img{width:calc(50% - 4px);height:auto;max-height:260px}.sg{display:inline-flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:#fff}.sg button{all:unset;cursor:pointer;padding:5px 13px;font-size:12px;font-weight:500}.sg button.on{background:var(--navy);color:#fff}
.cb{transform-box:fill-box;transform-origin:bottom;animation:gr .8s cubic-bezier(.2,.8,.2,1) both}@keyframes gr{from{transform:scaleY(0)}}
.ln{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.2s ease .3s forwards}@keyframes dr{to{stroke-dashoffset:0}}
.dn{animation:dd 1s ease both}@keyframes dd{from{stroke-dasharray:0 339.29}}
.sc{cursor:pointer;display:inline-flex;align-items:center}.sc.off{opacity:.35}
#tp{position:absolute;pointer-events:none;background:var(--navy);color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;display:none;z-index:9;white-space:nowrap}
.lo aside,.lo .bar{display:none}.lgn{max-width:400px;margin:7vh auto}
.mx td,.mx th{text-align:center}.pc{display:inline-block;min-width:20px;padding:1px 4px;border-radius:6px;font-size:11px;font-weight:600;background:#ecebf6;color:var(--navy);margin:1px}.pc.n{background:#fff;color:#c9c8dc;border:1px dashed var(--bd)}
.ts.er{background:var(--red)}.ts{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;z-index:99;box-shadow:0 4px 14px #0003}
@media (prefers-reduced-motion:reduce){.cb,.dn{animation:none}.ln{animation:none;stroke-dashoffset:0}}
.hd{display:none;width:100%;border-collapse:collapse;margin-bottom:14px}.hd td{border:1px solid #888;padding:6px 10px;vertical-align:middle}.hl{width:25%}.hl img{height:56px;display:block;margin:auto}.ht{text-align:center;font-weight:600;font-size:15px;color:var(--navy)}.hr{width:27%;font-size:10.5px;line-height:1.5}
#ph{margin:0 26px}.ph0,.po{display:none}.pf{display:none}
.fm{width:100%;border-collapse:collapse;margin:8px 0}.fm th{width:30%;text-align:left;background:#f3f3fa;border:1px solid var(--bd);padding:6px 8px;font-size:12px}.fm td{border:1px solid var(--bd);padding:6px 8px}
h4{margin:12px 0 4px;color:var(--navy);font-size:13px}.bx{border:1px solid var(--bd);border-radius:6px;padding:8px;min-height:44px;white-space:pre-wrap}
.sg3{width:100%;border-collapse:collapse;margin-top:16px}.sg3 th{border:1px solid #888;padding:5px;font-size:11px;background:#f3f3fa}.sg3 td{border:1px solid #888;height:70px}
.wa{background:#25d366!important}.dlb{display:none!important}body.dl .dlb{display:inline-block!important}
@media print{@page{margin:10mm}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{display:block;background:#fff;font-size:11px}aside,.bar,.ts,.sg,.tl,#tp{display:none!important}body:not(.pd) dialog{display:none!important}
main{display:block}.pg{padding:0}#ph{margin:0}.ph0{display:block}.hd{display:table}.po{display:block}.np{display:none!important}.pf{display:block;position:fixed;bottom:0;left:0;right:0;font-size:9px;color:#666;border-top:1px solid #aaa;padding-top:3px;text-align:center}
.c{box-shadow:none;break-inside:avoid;border-color:#ccc}.w{overflow:visible}table{font-size:10.5px}tr{break-inside:avoid}
.cb,.ln,.dn{animation:none!important}.ln{stroke-dashoffset:0}.g.k{grid-template-columns:repeat(4,1fr)}
body.pd main{display:none!important}body.pd dialog[open]{position:static;display:block;width:100%;max-height:none;margin:0;padding:0;box-shadow:none}body.pd dialog[open]::backdrop{display:none}
.bt,body.dl .dlb{display:none!important}}
@media(max-width:860px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap}.lg{width:140px;border:0;margin:0}.ft{display:none}.two,.eq2{grid-template-columns:1fr}.pg{padding:14px}.bar{padding:12px 14px}}
</style>
</head>
